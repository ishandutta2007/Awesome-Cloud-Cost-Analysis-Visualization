<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>

    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="chartBar1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="chartBar2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="chartBar3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes wave {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }
    @keyframes pulse {
      0% { opacity: 0.3; }
      50% { opacity: 0.8; }
      100% { opacity: 0.3; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-30px) translateX(15px); opacity: 0.7; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    }
    .wave-bg { animation: wave 6s ease-in-out infinite; }
    .pulse-glow { animation: pulse 4s ease-in-out infinite; }
    .particle1 { animation: floatParticle 8s ease-in-out infinite; }
    .particle2 { animation: floatParticle 6s ease-in-out infinite 2s; }
  </style>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>

  <!-- Background Grid Lines -->
  <g stroke="url(#gridGrad)" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>

    <line x1="150" y1="0" x2="150" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="450" y1="0" x2="450" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="750" y1="0" x2="750" y2="400"/>
    <line x1="900" y1="0" x2="900" y2="400"/>
    <line x1="1050" y1="0" x2="1050" y2="400"/>
  </g>

  <!-- Dynamic / Animated Background Graphics (Subtle behind text) -->
  <g class="wave-bg" opacity="0.4">
    <!-- Abstract Chart Bars in Background Right -->
    <rect x="820" y="220" width="40" height="120" rx="6" fill="url(#chartBar1)"/>
    <rect x="880" y="170" width="40" height="170" rx="6" fill="url(#chartBar2)"/>
    <rect x="940" y="130" width="40" height="210" rx="6" fill="url(#chartBar3)"/>
    <rect x="1000" y="190" width="40" height="150" rx="6" fill="url(#chartBar1)"/>
    <rect x="1060" y="100" width="40" height="240" rx="6" fill="url(#chartBar2)"/>

    <!-- Wave Line Graph -->
    <path d="M 800 280 Q 860 200, 920 240 T 1040 160 T 1160 120" fill="none" stroke="#38bdf8" stroke-width="4" filter="url(#glow)"/>
  </g>

  <!-- Floating Glowing Orbs -->
  <circle class="particle1" cx="200" cy="100" r="4" fill="#38bdf8"/>
  <circle class="particle2" cx="1000" cy="80" r="6" fill="#c084fc"/>
  <circle class="particle1" cx="1100" cy="300" r="5" fill="#818cf8"/>

  <!-- Foreground Title and Subtitle Area (High contrast, clearly visible) -->
  <!-- Top Badge Pill -->
  <g transform="translate(80, 75)">
    <rect x="0" y="0" width="280" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="140" y="23" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1">
      ⚡ FINOPS &amp; COST ANALYTICS
    </text>
  </g>

  <!-- Main Title -->
  <text x="80" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#ffffff">
    Awesome Cloud Cost
  </text>
  <text x="80" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="url(#accentGrad)" filter="url(#glow)">
    Analysis &amp; Visualization
  </text>

  <!-- Subtitle Description -->
  <text x="80" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#94a3b8" font-weight="400">
    Curated list of commercial FinOps platforms, Kubernetes cost allocation tools,
  </text>
  <text x="80" y="302" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#94a3b8" font-weight="400">
    and open-source spend analytics dashboards.
  </text>

  <!-- Bottom Accent Line -->
  <rect x="80" y="340" width="1040" height="3" rx="1.5" fill="url(#accentGrad)"/>
</svg>
